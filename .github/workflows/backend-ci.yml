name: backend-ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check api-spec and erd against code
        run: |
          python3 check_api_spec.py ../..
          python3 check_erd.py ../..
          python3 -m unittest test_check_api_spec test_check_erd
        working-directory: .github/scripts
      - run: chmod +x gradlew
      - run: ./gradlew build
      - name: Check test count against baseline
        run: python3 ../.github/scripts/check_test_count.py build/test-results/test test-baseline.txt

  deploy:
    needs: build
    # 3차 저장소는 Kotlin 전환 회귀(step-6) 통과 전까지 배포하지 않는다.
    # 전환 시 Settings > Secrets and variables > Actions > Variables에 DEPLOY_ENABLED=true 를 등록하면 켜진다.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build (skip tests, already passed above)
        run: chmod +x gradlew && ./gradlew clean build -x test
      # 운영 프로세스는 systemd(slotkey.service)가 관리한다. 러너가 직접 java를 띄우면
      # systemd가 재시작한 옛 jar가 8080을 먼저 잡아 새 코드가 반영되지 않는다.
      - name: Deploy jar and restart service
        run: |
          install -D -m 644 build/libs/slotkey-0.0.1-SNAPSHOT.jar /home/ubuntu/slotkey/slotkey.jar
          date '+%Y-%m-%d %H:%M:%S' > "$RUNNER_TEMP/restart_at"
          sudo systemctl restart slotkey
      - name: Health check
        run: |
          since=$(cat "$RUNNER_TEMP/restart_at")
          for i in {1..24}; do
            if ! systemctl is-active --quiet slotkey; then
              echo "slotkey.service is not active"; sudo journalctl -u slotkey -n 50 --no-pager; exit 1
            fi
            # 응답 코드만 보면 옛 프로세스도 통과하므로, 이번 재시작 이후의 기동 완료 로그를 확인한다.
            if sudo journalctl -u slotkey --since "$since" --no-pager | grep -q "Started .* in .* seconds"; then
              echo "slotkey started"; exit 0
            fi
            sleep 5
          done
          echo "server did not start in time"
          sudo journalctl -u slotkey -n 50 --no-pager
          exit 1
