plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'

    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.25'
    id 'org.jetbrains.kotlin.plugin.allopen' version '1.9.25'
    id 'org.jlleitschuh.gradle.ktlint' version '12.1.1'
    id 'info.solidsoft.pitest' version '1.19.0'

    id 'org.jetbrains.kotlin.plugin.lombok' version '1.9.25'
}

group = 'com.ovengers'
version = '0.0.1-SNAPSHOT'

springBoot {
    mainClass = 'com.ovengers.slotkey.SlotKeyApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}
ext {
    set('testcontainers.version', "1.21.4")
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
kotlin {
    jvmToolchain(21)
}

allOpen {
    annotation('jakarta.persistence.Entity')
    annotation('jakarta.persistence.MappedSuperclass')
    annotation('jakarta.persistence.Embeddable')
}

ktlint {
    version = '1.3.1'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.test.context.cache.maxSize', '2'
}

// 뮤테이션 테스트(수동 실행: ./gradlew pitest). 대상·범위는 docs/plans/mutation-testing 참고.
pitest {
    junit5PluginVersion = '1.2.3'
    targetClasses = [
        'com.ovengers.slotkey.reservation.policy.ReservationTimePolicy',
        'com.ovengers.slotkey.reservation.policy.ReservationRefundPolicy',
        'com.ovengers.slotkey.reservation.service.PricingService',
        'com.ovengers.slotkey.credit.entity.ChargeOrder',
        'com.ovengers.slotkey.credit.entity.ChargeOrder$*',
        'com.ovengers.slotkey.space.policy.SpaceOperatingHoursPolicy',
        'com.ovengers.slotkey.credit.service.CreditServiceImpl',
        'com.ovengers.slotkey.access.policy.DoorAccessTimePolicy',
        // #191: space/audit/stats 핵심 로직 확장. Space$Companion은 검증 로직을 담고 있어
        // 상위 Space 패턴만으로는 포함되지 않으므로 별도로 지정한다.
        'com.ovengers.slotkey.space.entity.Space',
        'com.ovengers.slotkey.space.entity.Space$Companion',
        'com.ovengers.slotkey.space.service.AdminSpaceService',
        'com.ovengers.slotkey.space.service.SpaceQueryService',
        'com.ovengers.slotkey.space.service.SpaceSlotAvailabilityService',
        'com.ovengers.slotkey.audit.service.AuditLogService',
        'com.ovengers.slotkey.audit.service.AuditLogQueryService',
        'com.ovengers.slotkey.stats.entity.RankingPeriodType*',
        'com.ovengers.slotkey.stats.repository.SpaceRankingAggregate'
    ]
    targetTests = [
        'com.ovengers.slotkey.reservation.policy.*',
        'com.ovengers.slotkey.reservation.service.PricingServiceTest',
        'com.ovengers.slotkey.credit.entity.ChargeOrderMutationTest',
        'com.ovengers.slotkey.credit.service.ChargeOrderServiceTest',
        'com.ovengers.slotkey.credit.service.ChargeOrderConfirmServiceTest',
        'com.ovengers.slotkey.credit.scheduler.ChargeOrderRecoverySchedulerTest',
        'com.ovengers.slotkey.credit.webhook.PgWebhookEventSchedulerTest',
        'com.ovengers.slotkey.space.policy.SpaceOperatingHoursPolicyTest',
        'com.ovengers.slotkey.space.service.SpaceSlotAvailabilityServiceTest',
        'com.ovengers.slotkey.credit.service.CreditServiceImplTest',
        'com.ovengers.slotkey.credit.service.CreditServiceImplMutationTest',
        'com.ovengers.slotkey.access.policy.DoorAccessTimePolicyTest',
        // #191: 확장한 space/audit/stats 대상의 대응 단위 테스트.
        'com.ovengers.slotkey.space.entity.SpaceTest',
        'com.ovengers.slotkey.space.service.AdminSpaceServiceTest',
        'com.ovengers.slotkey.space.service.SpaceQueryServiceTest',
        'com.ovengers.slotkey.audit.service.AuditLogQueryServiceTest',
        'com.ovengers.slotkey.audit.service.AuditLogServiceTest',
        'com.ovengers.slotkey.stats.entity.RankingPeriodTypeTest',
        'com.ovengers.slotkey.stats.repository.SpaceRankingAggregateTest',
        // #191: 생존 변이로 확인된 업무 규칙 공백을 새 파일로 고정한다.
        'com.ovengers.slotkey.space.service.AdminSpaceServiceMutationTest',
        'com.ovengers.slotkey.space.entity.SpaceMutationTest',
        'com.ovengers.slotkey.audit.service.AuditLogQueryServiceMutationTest',
        'com.ovengers.slotkey.audit.service.AuditLogServiceMutationTest'
    ]
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    mutators = ['STRONGER']
    threads = 4
}
